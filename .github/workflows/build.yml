name: Build Custom WSL2 Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 333
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          packages=(git base-devel bc bison flex pahole libelf elfutils openssl zstd kmod cpio gawk gcc llvm clang lld ccache patch curl pigz xz lz4 linux-headers glibc gcc-libs zlib perl python python-pip findutils grep sed coreutils util-linux linux-firmware procps-ng iproute2 )
          for pkg in "${packages[@]}"; do pacman -S --noconfirm "$pkg"; done

      - name: Setup ccache
        run: |
          mkdir -p /tmp/ccache
          echo "CCACHE_DIR=/tmp/ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-kernel-k501lb-${{ github.sha }}
          restore-keys: ${{ runner.os }}-kernel-k501lb-

      - name: Build Kernel
        run: |
          git clone --depth=1 https://github.com/microsoft/WSL2-Linux-Kernel.git .
          
          #curl -L --retry 3 -o prjc.patch https://raw.githubusercontent.com/cachyos/kernel-patches/master/6.18/sched/0001-prjc-cachy.patch
          #patch -p1 --ignore-whitespace --fuzz=3 < prjc.patch
          
          export CC="gcc"
          export CXX="g++"
          
          make mrproper
          make KCONFIG_CONFIG=Microsoft/config-wsl kvm_guest.config
          cp Microsoft/config-wsl .config
          
          if [ ! -f .config ]; then
              echo ".config không tồn tại, kiểm tra lại lệnh cấu hình!"
              exit 1
          fi
          
          echo "Dung lượng đĩa trước khi build:" && df -h
          
          ./scripts/config --set-val CONFIG_HYPERV y
          ./scripts/config --set-val CONFIG_HYPERV_NET y
          ./scripts/config --set-val CONFIG_HYPERV_STORAGE y
          ./scripts/config --set-val CONFIG_HYPERV_BALLOON y
          ./scripts/config --set-val CONFIG_HYPERV_IOMMU y
          ./scripts/config --set-val CONFIG_EXT4_FS y
          ./scripts/config --set-val CONFIG_9P_FS y
          ./scripts/config --set-val CONFIG_SCHED_PRJC y
          ./scripts/config --set-val CONFIG_PREEMPT_DYNAMIC y
          ./scripts/config --set-val CONFIG_MODULES y
          ./scripts/config --set-val CONFIG_MODULE_UNLOAD y
          ./scripts/config --set-val CONFIG_BPF y
          ./scripts/config --set-val CONFIG_BPF_SYSCALL y
          ./scripts/config --set-val CONFIG_BPF_JIT y
          ./scripts/config --set-val CONFIG_SECCOMP y
          ./scripts/config --set-val CONFIG_SECCOMP_FILTER y
          ./scripts/config --set-val CONFIG_CGROUPS y
          ./scripts/config --set-val CONFIG_CGROUP_V2 y
          ./scripts/config --set-val CONFIG_MEMCG y
          ./scripts/config --set-val CONFIG_MEMCG_SWAP y
          ./scripts/config --set-val CONFIG_MEMCG_KMEM y
          ./scripts/config --set-val CONFIG_HZ_1000 y
          ./scripts/config --set-val CONFIG_KSM y
          ./scripts/config --set-val CONFIG_BLK_DEV_SD y
          ./scripts/config --set-val CONFIG_SCSI y
          ./scripts/config --set-val CONFIG_DRM y
          ./scripts/config --set-val CONFIG_FUSE_FS y
          ./scripts/config --set-val CONFIG_OVERLAY_FS y
          ./scripts/config --set-val CONFIG_VIRTIO_BALLOON y
          ./scripts/config --set-val CONFIG_KERNEL_ZSTD y
          ./scripts/config --set-val CONFIG_KALLSYMS y
          ./scripts/config --set-val CONFIG_KALLSYMS_ALL y
          ./scripts/config --set-val CONFIG_PSI y
          ./scripts/config --set-val CONFIG_KEYS y
          ./scripts/config --set-val CONFIG_SECURITY y
          ./scripts/config --set-val CONFIG_USERFAULTFD y
          ./scripts/config --set-val CONFIG_NAMESPACES y
          ./scripts/config --set-val CONFIG_UTS_NS y
          ./scripts/config --set-val CONFIG_IPC_NS y
          ./scripts/config --set-val CONFIG_PID_NS y
          ./scripts/config --set-val CONFIG_NET_NS y
          ./scripts/config --set-val CONFIG_USER_NS y
          ./scripts/config --set-val CONFIG_CGROUP_CPUACCT y
          ./scripts/config --set-val CONFIG_CGROUP_DEVICE y
          ./scripts/config --set-val CONFIG_CGROUP_FREEZER y
          ./scripts/config --set-val CONFIG_CGROUP_PIDS y
          ./scripts/config --set-val CONFIG_PRINTK_TIME y
          ./scripts/config --set-val CONFIG_PANIC_ON_OOPS y
          ./scripts/config --set-val CONFIG_MCORE2 y
          ./scripts/config --set-val CONFIG_SCHED_AUTOGROUP y
          ./scripts/config --set-val CONFIG_INTEL_PSTATE y
          ./scripts/config --set-val CONFIG_ZRAM y
          ./scripts/config --set-val CONFIG_DRM_VIRTIO_GPU y
          ./scripts/config --set-val CONFIG_MQ_IOSCHED_KYBER y
          ./scripts/config --set-val CONFIG_IOSCHED_BFQ y
          ./scripts/config --set-val CONFIG_BFQ_GROUP_IOSCHED y
          ./scripts/config --set-val CONFIG_CUSE y
          ./scripts/config --set-val CONFIG_POSIX_MQUEUE y
          ./scripts/config --set-val CONFIG_KEY_DH_OPERATIONS y
          ./scripts/config --set-val CONFIG_PACKET y
          ./scripts/config --set-val CONFIG_FILTER y
          ./scripts/config --set-val CONFIG_XDP_SOCKETS y
          ./scripts/config --set-val CONFIG_NET_CLS_BPF y
          ./scripts/config --set-val CONFIG_VIRTIO_VSOCKETS y
          ./scripts/config --set-val CONFIG_CRYPTO_CHACHA20POLY1305 y
          ./scripts/config --set-val CONFIG_CRYPTO_CURVE25519 y
          ./scripts/config --set-val CONFIG_CRYPTO_AES y
          ./scripts/config --set-val CONFIG_CRYPTO_SHA256 y
          ./scripts/config --set-val CONFIG_ZSMALLOC y
          ./scripts/config --set-val CONFIG_CFS_BANDWIDTH y
          ./scripts/config --set-val CONFIG_EXT4_FS_POSIX_ACL y
          ./scripts/config --set-val CONFIG_EXT4_FS_SECURITY y
          ./scripts/config --set-val CONFIG_IKCONFIG y
          ./scripts/config --set-val CONFIG_IKCONFIG_PROC y
          ./scripts/config --set-val CONFIG_DM_THIN_PROVISIONING y
          # --- CẤU HÌNH MẠNG VÀ MODULES (MODULE) ---
          ./scripts/config --set-val CONFIG_NETFILTER m
          ./scripts/config --set-val CONFIG_NF_CONNTRACK m
          ./scripts/config --set-val CONFIG_BRIDGE_NETFILTER m
          ./scripts/config --set-val CONFIG_BRIDGE m
          ./scripts/config --set-val CONFIG_VETH m
          ./scripts/config --set-val CONFIG_TUN m
          ./scripts/config --set-val CONFIG_TAP m
          ./scripts/config --set-val CONFIG_NET_SCHED m
          ./scripts/config --set-val CONFIG_NET_SCH_FQ_CODEL m
          ./scripts/config --set-val CONFIG_NET_SCH_CAKE m
          ./scripts/config --set-val CONFIG_IP_NF_NAT m
          ./scripts/config --set-val CONFIG_IP_NF_TARGET_MASQUERADE m
          ./scripts/config --set-val CONFIG_BRIDGE_NF_EBTABLES m
          ./scripts/config --set-val CONFIG_TCP_CONG_BBR m
          ./scripts/config --set-val CONFIG_WIREGUARD m
          ./scripts/config --set-val CONFIG_NETFILTER_NETLINK m
          ./scripts/config --set-val CONFIG_NETFILTER_NETLINK_ACCT m
          ./scripts/config --set-val CONFIG_NETFILTER_NETLINK_QUEUE m
          ./scripts/config --set-val CONFIG_NETFILTER_NETLINK_LOG m
          ./scripts/config --set-val CONFIG_NF_CT_NETLINK m
          ./scripts/config --set-val CONFIG_NF_LOG_NETDEV m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_BPF m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_CONNMARK m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_CONNLIMIT m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_IPRANGE m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_LENGTH m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_LIMIT m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_MAC m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_MARK m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_MULTIPORT m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_PKTTYPE m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_STATE m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_TARGET_MASQUERADE m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_TARGET_REDIRECT m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_TARGET_LOG m
          ./scripts/config --set-val CONFIG_NF_NAT_MASQUERADE m
          ./scripts/config --set-val CONFIG_NF_NAT_REDIRECT m
          ./scripts/config --set-val CONFIG_NET_UDP_TUNNEL m
          ./scripts/config --set-val CONFIG_NET_TCPPROBE m
          ./scripts/config --set-val CONFIG_NETWORK_FILESYSTEMS m
          ./scripts/config --set-val CONFIG_F2FS_FS_COMPRESSION m
          ./scripts/config --set-val CONFIG_F2FS_STAT_FS m
          ./scripts/config --set-val CONFIG_BLK_CGROUP m
          ./scripts/config --set-val CONFIG_CGROUP_PERF m
          ./scripts/config --set-val CONFIG_CGROUP_NET_CLASSID m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_TARGET_CONNMARK m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_TARGET_NFQUEUE m
          ./scripts/config --set-val CONFIG_IP_VS m
          ./scripts/config --set-val CONFIG_IP_VS_PROTO_TCP m
          ./scripts/config --set-val CONFIG_IP_VS_PROTO_UDP m
          ./scripts/config --set-val CONFIG_VXLAN m
          ./scripts/config --set-val CONFIG_L2TP m
          ./scripts/config --set-val CONFIG_GRE m
          ./scripts/config --set-val CONFIG_BRIDGE_VLAN_FILTERING m
          ./scripts/config --set-val CONFIG_NETFILTER_XT_MATCH_ADDRTYPE m
          ./scripts/config --set-val CONFIG_NF_NAT_IPV4 m
          ./scripts/config --set-val CONFIG_NF_NAT_IPV6 m
          ./scripts/config --set-val CONFIG_RD_ZSTD m
          ./scripts/config --set-val CONFIG_CRYPTO_ZSTD m
          ./scripts/config --set-val CONFIG_ZSTD_COMMON m
          ./scripts/config --set-val CONFIG_ZSTD_COMPRESS m
          ./scripts/config --set-val CONFIG_ZSTD_DECOMPRESS m

          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          
          make olddefconfig
          
          make olddefconfig
          make -j$(nproc)
          
      - name: Process and Package All Artifacts
        run: |
          mkdir -p /tmp/wsl_out
          cp arch/x86/boot/bzImage /tmp/wsl_out/bzImage
          cp vmlinux /tmp/wsl_out/vmlinux
          cp System.map /tmp/wsl_out/System.map
          cp .config /tmp/wsl_out/config.bak

          mkdir -p modules
          make INSTALL_MOD_PATH="$PWD/modules" modules_install
          mkdir -p /tmp/wsl_out/lib/firmware
          make firmware_install INSTALL_FW_PATH=/tmp/wsl_out/lib/firmware

          ./Microsoft/scripts/gen_modules_vhdx.sh "$PWD/modules" $(make -s kernelrelease) /tmp/wsl_out/modules.vhdx
          
          find "$PWD/modules" -name "*.ko" -print0 | xargs -0 -P $(nproc) -I {} strip --strip-debug {}
          
          mkdir -p /tmp/pack_dir/lib
          cp -r "$PWD/modules/lib/modules" /tmp/pack_dir/lib/
          cp -r /tmp/wsl_out/lib/firmware /tmp/pack_dir/lib/
          
          cd /tmp/pack_dir
          tar -cf - lib/ | pigz -9 -p$(nproc) > /tmp/wsl_out/modules_firmware.tar.gz
          cd / && rm -rf /tmp/pack_dir
          
          pigz -9 -p$(nproc) /tmp/wsl_out/vmlinux
          
          echo "Danh sách sản phẩm cuối cùng:"
          ls -lh /tmp/wsl_out/
          
          make clean
          df -h
          
          find /tmp/wsl_out/lib/modules -name "build" -exec rm -rf {} +
          find /tmp/wsl_out/lib/modules -name "source" -exec rm -rf {} +

          echo "Dung lượng đĩa sau khi build và dọn dẹp:" && df -h
          
      - name: Upload Final Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WSL2-Kernel-Custom
          path: |
            /tmp/wsl_out/bzImage
            /tmp/wsl_out/modules_firmware.tar.gz
            /tmp/wsl_out/System.map
            /tmp/wsl_out/vmlinux.gz
            /tmp/wsl_out/modules.vhdx
            /tmp/wsl_out/config.bak
            retention-days: 67
