name: Build Custom WSL2 Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 333
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          packages=(git base-devel bc bison flex pahole libelf elfutils openssl zstd kmod cpio gawk gcc llvm clang lld ccache patch curl pigz xz lz4 linux-headers glibc gcc-libs zlib perl python python-pip findutils grep sed coreutils util-linux linux-firmware procps-ng iproute2 )
          for pkg in "${packages[@]}"; do pacman -S --noconfirm "$pkg"; done

      - name: Setup ccache
        run: |
          mkdir -p /tmp/ccache
          echo "CCACHE_DIR=/tmp/ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-kernel-k501lb-${{ github.sha }}
          restore-keys: ${{ runner.os }}-kernel-k501lb-

      - name: Build Kernel
        run: |
          git clone --depth=1 https://github.com/microsoft/WSL2-Linux-Kernel.git .
          
          #curl -L --retry 3 -o prjc.patch https://raw.githubusercontent.com/cachyos/kernel-patches/master/6.18/sched/0001-prjc-cachy.patch
          #patch -p1 --ignore-whitespace --fuzz=3 < prjc.patch
          
          export CC="gcc"
          export CXX="g++"
          
          make mrproper
          make KCONFIG_CONFIG=Microsoft/config-wsl kvm_guest.config
          cp Microsoft/config-wsl .config
          
          if [ ! -f .config ]; then
              echo ".config không tồn tại, kiểm tra lại lệnh cấu hình!"
              exit 1
          fi
          
          echo "Dung lượng đĩa trước khi build:" && df -h
          
          for conf in CONFIG_HYPERV CONFIG_HYPERV_NET CONFIG_HYPERV_STORAGE CONFIG_HYPERV_BALLOON \
                      CONFIG_HYPERV_IOMMU CONFIG_HYPERV_TSCNEC CONFIG_EXT4_FS CONFIG_9P_FS \
                      CONFIG_SCHED_PRJC CONFIG_PREEMPT_DYNAMIC CONFIG_MODULES CONFIG_MODULE_UNLOAD \
                      CONFIG_MODVERSIONS CONFIG_9P_FS_POSIX_ACL CONFIG_9P_FS_SECURITY CONFIG_BPF \
                      CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_FUNCTION_TRACER CONFIG_JUMP_LABEL \
                      CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_FRAME_POINTER CONFIG_SECCOMP \
                      CONFIG_SECCOMP_FILTER CONFIG_KEYS CONFIG_SECURITY CONFIG_PSI CONFIG_LRU_GEN \
                      CONFIG_LRU_GEN_ENABLED CONFIG_USERFAULTFD CONFIG_NAMESPACES CONFIG_UTS_NS \
                      CONFIG_IPC_NS CONFIG_PID_NS CONFIG_NET_NS CONFIG_USER_NS CONFIG_CGROUPS \
                      CONFIG_CGROUP_V2 CONFIG_CGROUP_CPUACCT CONFIG_CGROUP_DEVICE CONFIG_CGROUP_FREEZER \
                      CONFIG_CGROUP_PIDS CONFIG_MEMCG CONFIG_MEMCG_SWAP CONFIG_MEMCG_KMEM \
                      CONFIG_PRINTK_TIME CONFIG_PANIC_ON_OOPS CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
                      CONFIG_HZ_1000 CONFIG_MCORE2 CONFIG_SCHED_AUTOGROUP CONFIG_INTEL_PSTATE \
                      CONFIG_ZRAM CONFIG_KSM CONFIG_BLK_DEV_SD CONFIG_SCSI CONFIG_NETDEVICES \
                      CONFIG_DRM CONFIG_DRM_VIRTIO_GPU CONFIG_MQ_IOSCHED_KYBER CONFIG_IOSCHED_BFQ \
                      CONFIG_BFQ_GROUP_IOSCHED CONFIG_FUSE_FS CONFIG_CUSE CONFIG_POSIX_MQUEUE \
                      CONFIG_KEY_DH_OPERATIONS CONFIG_PACKET CONFIG_FILTER CONFIG_XDP_SOCKETS \
                      CONFIG_NET_CLS_BPF CONFIG_OVERLAY_FS CONFIG_VIRTIO_VSOCKETS CONFIG_VIRTIO_BALLOON \
                      CONFIG_CRYPTO_CHACHA20POLY1305 CONFIG_CRYPTO_CURVE25519 CONFIG_CRYPTO_AES \
                      CONFIG_CRYPTO_SHA256 CONFIG_ZSMALLOC CONFIG_CRYPTO_ZSTD; do
            ./scripts/config --set-val $conf y
          done

          for conf in CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_BRIDGE_NETFILTER CONFIG_BRIDGE \
                      CONFIG_VETH CONFIG_TUN CONFIG_TAP CONFIG_NET_SCHED CONFIG_NET_SCH_FQ_CODEL \
                      CONFIG_NET_SCH_CAKE CONFIG_IP_NF_NAT CONFIG_IP_NF_TARGET_MASQUERADE \
                      CONFIG_BRIDGE_NF_EBTABLES CONFIG_TCP_CONG_BBR CONFIG_DEFAULT_BBR \
                      CONFIG_WIREGUARD CONFIG_NETFILTER_NETLINK CONFIG_NETFILTER_NETLINK_ACCT \
                      CONFIG_NETFILTER_NETLINK_QUEUE CONFIG_NETFILTER_NETLINK_LOG CONFIG_NF_CT_NETLINK \
                      CONFIG_NF_LOG_NETDEV CONFIG_NETFILTER_XT_MATCH_BPF CONFIG_NETFILTER_XT_MATCH_CONNMARK \
                      CONFIG_NETFILTER_XT_MATCH_CONNLIMIT CONFIG_NETFILTER_XT_MATCH_IPRANGE \
                      CONFIG_NETFILTER_XT_MATCH_LENGTH CONFIG_NETFILTER_XT_MATCH_LIMIT \
                      CONFIG_NETFILTER_XT_MATCH_MAC CONFIG_NETFILTER_XT_MATCH_MARK \
                      CONFIG_NETFILTER_XT_MATCH_MULTIPORT CONFIG_NETFILTER_XT_MATCH_PKTTYPE \
                      CONFIG_NETFILTER_XT_MATCH_STATE CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
                      CONFIG_NETFILTER_XT_TARGET_REDIRECT CONFIG_NETFILTER_XT_TARGET_LOG \
                      CONFIG_NF_NAT_MASQUERADE CONFIG_NF_NAT_REDIRECT CONFIG_NET_UDP_TUNNEL \
                      CONFIG_NET_TCPPROBE CONFIG_NETWORK_FILESYSTEMS CONFIG_F2FS_FS_COMPRESSION \
                      CONFIG_F2FS_STAT_FS CONFIG_BLK_CGROUP CONFIG_CGROUP_PERF CONFIG_CGROUP_NET_CLASSID \
                      CONFIG_NETFILTER_XT_TARGET_CONNMARK CONFIG_NETFILTER_XT_TARGET_NFQUEUE \
                      CONFIG_IP_VS CONFIG_IP_VS_PROTO_TCP CONFIG_IP_VS_PROTO_UDP CONFIG_VXLAN \
                      CONFIG_L2TP CONFIG_GRE CONFIG_BRIDGE_VLAN_FILTERING CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                      CONFIG_NF_NAT_IPV4 CONFIG_NF_NAT_IPV6 CONFIG_KERNEL_ZSTD CONFIG_RD_ZSTD \
                      CONFIG_CRYPTO_ZSTD CONFIG_ZSTD_COMMON CONFIG_ZSTD_COMPRESS CONFIG_ZSTD_DECOMPRESS; do
            ./scripts/config -m $conf
          done
          
          make olddefconfig

          if ! make -j$(nproc) V=1; then
            echo "--- LỖI XUẤT HIỆN: Xuất 100 dòng cuối của file lỗi ---"
            exit 1
          fi
          
          mkdir -p /tmp/wsl_out
          cp arch/x86/boot/bzImage /tmp/wsl_out/bzImage
          cp vmlinux /tmp/wsl_out/vmlinux
          cp System.map /tmp/wsl_out/System.map
          cp .config /tmp/wsl_out/config.bak
          
          make clean
          
          mkdir -p /tmp/wsl_out/lib/firmware
          make modules_install INSTALL_MOD_PATH=/tmp/wsl_out
          make firmware_install INSTALL_FW_PATH=/tmp/wsl_out/lib/firmware
          
          depmod -b /tmp/wsl_out -a
          
          find /tmp/wsl_out/lib/modules -name "build" -exec rm -rf {} +
          find /tmp/wsl_out/lib/modules -name "source" -exec rm -rf {} +
          find /tmp/wsl_out/lib/modules -name "*.ko" | xargs -P $(nproc) -I {} strip --strip-debug {}

          cd /tmp/wsl_out
          pigz -9 -p$(nproc) vmlinux
          tar -cf - lib/modules/ | pigz -p$(nproc) > modules.tar.gz
          tar -cf - lib/firmware/ | pigz -p$(nproc) > firmware.tar.gz
          rm -rf lib/
          
          echo "Dung lượng đĩa sau khi build và dọn dẹp:" && df -h
          
      - name: Run Auto-Test in QEMU
        run: |
          pacman -S --noconfirm qemu-system-x86
          
          echo "Đang test boot kernel..."
          
          timeout 90m qemu-system-x86_64 \
            -kernel arch/x86/boot/bzImage \
            -append "console=ttyS0 panic=1 quiet" \
            -display none \
            -serial stdio \
            -smp 4 \
            -m 1G \
            -no-reboot
            
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS: Kernel chạy xong không lỗi!"
          elif [ $EXIT_CODE -eq 124 ]; then
            echo "PANIC: Kernel bị treo cứng (Deadlock) sau 90 phút!"
            exit 1
          else
            echo "PANIC: Kernel bị crash với mã lỗi $EXIT_CODE!"
            echo "--- Dòng log cuối cùng trước khi crash ---"
            dmesg | tail -n 20 || echo "Không thể lấy log từ hệ thống."
            exit 1
          fi
          
      - name: Upload Final Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WSL2-Kernel-Custom
          path: |
            /tmp/wsl_out/bzImage
            /tmp/wsl_out/modules.tar.gz
            /tmp/wsl_out/firmware.tar.gz
            /tmp/wsl_out/System.map
            /tmp/wsl_out/vmlinux.gz
            retention-days: 67
